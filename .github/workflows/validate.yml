name: Validate Layout, Schemas & Contracts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run repository contract & JSON Schema validation
        run: python3 scripts/validate-repo.py

      - name: Check shell script syntax
        run: |
          bash -n scripts/check-env.sh
          bash -n scripts/bootstrap-cores.sh
          bash -n scripts/apply-patches.sh
