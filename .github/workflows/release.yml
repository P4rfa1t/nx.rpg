name: Release Switch NROs

# Full 4-target build producing the two player-facing zips plus the GPL
# corresponding-source archive, published as a GitHub Release.
# Triggered by version tags (v*) or manually. Day-to-day per-target builds
# live in build-launcher.yml / build-easyrpg.yml / build-nxjs-mvz.yml /
# build-mkxp-z.yml with path filters so only touched cores rebuild.

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'common/**'
      - 'launcher/**'
      - 'cores/**'
      - 'scripts/**'
      - 'assets/**'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'common/**'
      - 'launcher/**'
      - 'cores/**'
      - 'scripts/**'
      - 'assets/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  launcher:
    name: nx.rpg.nro (Borealis frontend)
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v6

      - name: Build toolchain dependencies (fmt/json/inih/pixman/ICU/liblcf/Borealis)
        working-directory: /tmp
        env:
          DNS_OK: '1'
        run: |
          set -euo pipefail
          export DEVKITPRO=/opt/devkitpro
          export PATH="$DEVKITPRO/devkitA64/bin:$DEVKITPRO/tools/bin:$PATH"
          PREFIX="$DEVKITPRO/portlibs/switch"
          NPROC="$(nproc)"

          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl unzip bison python3-pip python3-setuptools >/dev/null


          ARCH_FLAGS="-march=armv8-a+crc+crypto -mtune=cortex-a57 -mtp=soft -fPIC -ftls-model=local-exec"
          CROSS_CFLAGS="-O2 -g0 $ARCH_FLAGS -D__SWITCH__ -I$PREFIX/include"

          mkdir -p deps && cd deps

          pip3 install --quiet --break-system-packages "meson>=1.5.0" ninja

          {
            echo '[binaries]'
            echo "c = 'aarch64-none-elf-gcc'"
            echo "cpp = 'aarch64-none-elf-g++'"
            echo "ar = 'aarch64-none-elf-gcc-ar'"
            echo "strip = 'aarch64-none-elf-strip'"
            echo "pkg-config = 'aarch64-none-elf-pkg-config'"
            echo ''
            echo '[built-in options]'
            echo "c_args = ['-O2', '-g0', '-march=armv8-a+crc+crypto', '-mtune=cortex-a57', '-mtp=soft', '-fPIC', '-D__SWITCH__']"
            echo "cpp_args = ['-O2', '-g0', '-march=armv8-a+crc+crypto', '-mtune=cortex-a57', '-mtp=soft', '-fPIC', '-D__SWITCH__']"
            echo "c_link_args = ['-march=armv8-a+crc+crypto', '-specs=$DEVKITPRO/libnx/switch.specs', '-L$PREFIX/lib', '-L$DEVKITPRO/libnx/lib', '-lnx']"
            echo ''
            echo '[host_machine]'
            echo "system = 'horizon'"
            echo "cpu_family = 'aarch64'"
            echo "cpu = 'cortex-a57'"
            echo "endian = 'little'"
          } > meson-switch.txt

          # fmt (header+static) for Borealis
          curl -fsSLO https://github.com/fmtlib/fmt/releases/download/12.1.0/fmt-12.1.0.zip
          unzip -q fmt-12.1.0.zip
          cmake -S fmt-12.1.0 -B fmt-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/Switch.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DBUILD_SHARED_LIBS=OFF -DFMT_DOC=OFF -DFMT_TEST=OFF
          cmake --build fmt-build -j"$NPROC" && cmake --install fmt-build

          # nlohmann_json for nxrpg_common
          curl -fsSLO https://github.com/nlohmann/json/archive/v3.12.0.tar.gz
          tar xf v3.12.0.tar.gz
          perl -pi -e "s/CMAKE_INSTALL_DATADIR/CMAKE_INSTALL_LIBDIR/" json-3.12.0/CMakeLists.txt
          cmake -S json-3.12.0 -B json-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/Switch.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DJSON_BuildTests=OFF
          cmake --build json-build -j"$NPROC" && cmake --install json-build

          # inih r62 (inih + Ninih) for nxrpg_common INI parsing
          curl -fsSLO https://github.com/benhoyt/inih/archive/refs/tags/r62.tar.gz
          tar xf r62.tar.gz
          PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig" meson setup inih-build inih-r62 \
            --cross-file meson-switch.txt \
            --prefix="$PREFIX" --libdir=lib --buildtype=release \
            -Ddefault_library=static -Dtests=false
          meson compile -C inih-build -j"$NPROC" && meson install -C inih-build

          # pixman (Meson-based upstream) for Borealis
          curl -fsSLO https://cairographics.org/releases/pixman-0.46.4.tar.gz
          tar xf pixman-0.46.4.tar.gz
          PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig" meson setup pixman-build pixman-0.46.4 \
            --cross-file meson-switch.txt \
            --prefix="$PREFIX" --libdir=lib --buildtype=release -Ddefault_library=static \
            -Dtests=disabled -Ddemos=disabled -Dlibpng=disabled
          meson compile -C pixman-build -j"$NPROC" && meson install -C pixman-build

          # ICU (native + cross) for liblcf
          curl -fsSLO https://github.com/unicode-org/icu/releases/download/release-78.3/icu4c-78.3-sources.tgz
          tar xf icu4c-78.3-sources.tgz
          chmod +x icu/source/configure
          cp icu/source/config/mh-linux icu/source/config/mh-unknown
          perl -pi -e "s/SMALL_BUFFER_MAX_SIZE 512/SMALL_BUFFER_MAX_SIZE 2048/" icu/source/tools/toolutil/pkg_genc.h
          ICU_ARGS="--enable-strict=no --disable-tests --disable-samples --disable-dyload --disable-extras --disable-icuio --with-data-packaging=static --disable-layout --disable-layoutex --enable-draft=no"
          mkdir -p icu-native icu-cross
          (cd icu-native && ../icu/source/configure --enable-static --disable-shared $ICU_ARGS > /dev/null && make -j"$NPROC" > /dev/null)
          (cd icu-cross && \
            CC=aarch64-none-elf-gcc CXX=aarch64-none-elf-g++ \
            CFLAGS="$CROSS_CFLAGS" CXXFLAGS="$CROSS_CFLAGS" \
            LDFLAGS="-L$PREFIX/lib -L$DEVKITPRO/libnx/lib" LIBS="-lnx" \
            ../icu/source/configure --enable-static --disable-shared --prefix="$PREFIX" \
              --host=aarch64-none-elf --with-cross-build=/tmp/deps/icu-native --disable-tools $ICU_ARGS > /dev/null && \
            make -j"$NPROC" > /dev/null && make install > /dev/null)

          # liblcf for EasyRPG (also used by launcher engine detection paths)
          git clone --depth=1 https://github.com/EasyRPG/liblcf.git
          cmake -S liblcf -B liblcf-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/Switch.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DBUILD_SHARED_LIBS=OFF -DLIBLCF_UPDATE_MIMEDB=OFF \
            -DLIBLCF_ENABLE_TOOLS=OFF -DLIBLCF_ENABLE_TESTS=OFF
          cmake --build liblcf-build -j"$NPROC" && cmake --install liblcf-build

          # Borealis (xfangfang fork) at /opt/nxrpg/borealis
          mkdir -p /opt/nxrpg
          GIT_HTTP_VERSION=HTTP/1.1 git clone --depth=1 --recursive --shallow-submodules \
            https://github.com/xfangfang/borealis.git /opt/nxrpg/borealis

      - name: Build nx.rpg.nro
        run: bash scripts/build-launcher-switch.sh

      - name: Upload nx.rpg.nro
        uses: actions/upload-artifact@v7
        with:
          name: nx-rpg-launcher-nro
          path: sdcard/switch/nx.rpg/nx.rpg.nro
          retention-days: 1

  easyrpg:
    name: easyrpg.nro (RM2k / RM2k3)
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v6

      - name: Build toolchain dependencies (shared with launcher)
        working-directory: /tmp
        run: |
          set -euo pipefail
          export DEVKITPRO=/opt/devkitpro
          export PATH="$DEVKITPRO/devkitA64/bin:$DEVKITPRO/tools/bin:$PATH"
          PREFIX="$DEVKITPRO/portlibs/switch"
          NPROC="$(nproc)"

          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl unzip bison python3-pip python3-setuptools >/dev/null


          ARCH_FLAGS="-march=armv8-a+crc+crypto -mtune=cortex-a57 -mtp=soft -fPIC -ftls-model=local-exec"
          CROSS_CFLAGS="-O2 -g0 $ARCH_FLAGS -D__SWITCH__ -I$PREFIX/include"

          mkdir -p deps && cd deps

          pip3 install --quiet --break-system-packages "meson>=1.5.0" ninja

          {
            echo '[binaries]'
            echo "c = 'aarch64-none-elf-gcc'"
            echo "cpp = 'aarch64-none-elf-g++'"
            echo "ar = 'aarch64-none-elf-gcc-ar'"
            echo "strip = 'aarch64-none-elf-strip'"
            echo "pkg-config = 'aarch64-none-elf-pkg-config'"
            echo ''
            echo '[built-in options]'
            echo "c_args = ['-O2', '-g0', '-march=armv8-a+crc+crypto', '-mtune=cortex-a57', '-mtp=soft', '-fPIC', '-D__SWITCH__']"
            echo "cpp_args = ['-O2', '-g0', '-march=armv8-a+crc+crypto', '-mtune=cortex-a57', '-mtp=soft', '-fPIC', '-D__SWITCH__']"
            echo "c_link_args = ['-march=armv8-a+crc+crypto', '-specs=$DEVKITPRO/libnx/switch.specs', '-L$PREFIX/lib', '-L$DEVKITPRO/libnx/lib', '-lnx']"
            echo ''
            echo '[host_machine]'
            echo "system = 'horizon'"
            echo "cpu_family = 'aarch64'"
            echo "cpu = 'cortex-a57'"
            echo "endian = 'little'"
          } > meson-switch.txt

          curl -fsSLO https://github.com/fmtlib/fmt/releases/download/12.1.0/fmt-12.1.0.zip
          unzip -q fmt-12.1.0.zip
          cmake -S fmt-12.1.0 -B fmt-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/Switch.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DBUILD_SHARED_LIBS=OFF -DFMT_DOC=OFF -DFMT_TEST=OFF
          cmake --build fmt-build -j"$NPROC" && cmake --install fmt-build

          curl -fsSLO https://github.com/nlohmann/json/archive/v3.12.0.tar.gz
          tar xf v3.12.0.tar.gz
          perl -pi -e "s/CMAKE_INSTALL_DATADIR/CMAKE_INSTALL_LIBDIR/" json-3.12.0/CMakeLists.txt
          cmake -S json-3.12.0 -B json-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/Switch.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DJSON_BuildTests=OFF
          cmake --build json-build -j"$NPROC" && cmake --install json-build

          curl -fsSLO https://github.com/benhoyt/inih/archive/refs/tags/r62.tar.gz
          tar xf r62.tar.gz
          PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig" meson setup inih-build inih-r62 \
            --cross-file meson-switch.txt \
            --prefix="$PREFIX" --libdir=lib --buildtype=release \
            -Ddefault_library=static -Dtests=false
          meson compile -C inih-build -j"$NPROC" && meson install -C inih-build

          curl -fsSLO https://cairographics.org/releases/pixman-0.46.4.tar.gz
          tar xf pixman-0.46.4.tar.gz
          PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig" meson setup pixman-build pixman-0.46.4 \
            --cross-file meson-switch.txt \
            --prefix="$PREFIX" --libdir=lib --buildtype=release -Ddefault_library=static \
            -Dtests=disabled -Ddemos=disabled -Dlibpng=disabled
          meson compile -C pixman-build -j"$NPROC" && meson install -C pixman-build

          # ICU (native + cross) for liblcf
          curl -fsSLO https://github.com/unicode-org/icu/releases/download/release-78.3/icu4c-78.3-sources.tgz
          tar xf icu4c-78.3-sources.tgz
          chmod +x icu/source/configure
          cp icu/source/config/mh-linux icu/source/config/mh-unknown
          perl -pi -e "s/SMALL_BUFFER_MAX_SIZE 512/SMALL_BUFFER_MAX_SIZE 2048/" icu/source/tools/toolutil/pkg_genc.h
          ICU_ARGS="--enable-strict=no --disable-tests --disable-samples --disable-dyload --disable-extras --disable-icuio --with-data-packaging=static --disable-layout --disable-layoutex --enable-draft=no"
          mkdir -p icu-native icu-cross
          (cd icu-native && ../icu/source/configure --enable-static --disable-shared $ICU_ARGS > /dev/null && make -j"$NPROC" > /dev/null)
          (cd icu-cross && \
            CC=aarch64-none-elf-gcc CXX=aarch64-none-elf-g++ \
            CFLAGS="$CROSS_CFLAGS" CXXFLAGS="$CROSS_CFLAGS" \
            LDFLAGS="-L$PREFIX/lib -L$DEVKITPRO/libnx/lib" LIBS="-lnx" \
            ../icu/source/configure --enable-static --disable-shared --prefix="$PREFIX" \
              --host=aarch64-none-elf --with-cross-build=/tmp/deps/icu-native --disable-tools $ICU_ARGS > /dev/null && \
            make -j"$NPROC" > /dev/null && make install > /dev/null)

          git clone --depth=1 https://github.com/EasyRPG/liblcf.git
          cmake -S liblcf -B liblcf-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/Switch.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DBUILD_SHARED_LIBS=OFF -DLIBLCF_UPDATE_MIMEDB=OFF \
            -DLIBLCF_ENABLE_TOOLS=OFF -DLIBLCF_ENABLE_TESTS=OFF
          cmake --build liblcf-build -j"$NPROC" && cmake --install liblcf-build

          mkdir -p /opt/nxrpg
          GIT_HTTP_VERSION=HTTP/1.1 git clone --depth=1 --recursive --shallow-submodules \
            https://github.com/xfangfang/borealis.git /opt/nxrpg/borealis

      - name: Bootstrap & patch EasyRPG Player
        run: |
          bash scripts/bootstrap-cores.sh easyrpg
          bash scripts/apply-patches.sh easyrpg

      - name: Build easyrpg.nro
        run: bash scripts/build-easyrpg-switch.sh

      - name: Upload easyrpg.nro
        uses: actions/upload-artifact@v7
        with:
          name: easyrpg-core
          path: sdcard/switch/nx.rpg/cores/easyrpg.nro
          retention-days: 1

  nxjs-mvz:
    name: nxjs-mvz.nro (RM MV / MZ)
    runs-on: ubuntu-latest
    # switch-v8 + Skia toolchain lives in TooTallNate's pacman-packages image;
    # Node 22 + pnpm are layered on top at step 1.
    container:
      image: ghcr.io/tootallnate/pacman-packages@sha256:92880d77878639768fe3696800104d68de1dfec65802bf7915689dd7bd718e53
      options: --user root
    steps:
      - uses: actions/checkout@v6

      - name: Install Node 22 + pnpm
        run: |
          set -euo pipefail
          curl -fsSL https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.xz \
            -o /tmp/node.tar.xz
          tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
          npm install -g pnpm@9
          node --version && pnpm --version

      - name: Build nxjs-mvz.nro (patched runtime + shim + fat NRO)
        run: bash scripts/build-nxjs-mvz-switch.sh

      - name: Upload nxjs-mvz.nro
        uses: actions/upload-artifact@v7
        with:
          name: nxjs-mvz-core
          path: sdcard/switch/nx.rpg/cores/nxjs-mvz.nro
          retention-days: 1

  mkxp-z:
    name: mkxp-z.nro (RMXP / VX / VXAce)
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Meson + host Ruby + bison
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ruby-full bison curl python3-pip python3-setuptools >/dev/null
          pip3 install --quiet --break-system-packages "meson>=1.5.0" ninja

      - name: Bootstrap & patch mkxp-z
        run: |
          bash scripts/bootstrap-cores.sh mkxp-z
          bash scripts/apply-patches.sh mkxp-z

      - name: Pre-cache Ruby 3.1.3 tarball (wrap source_hash verified on extraction)
        run: |
          mkdir -p third_party/mkxp-z/subprojects/packagecache
          curl -fsSL -o third_party/mkxp-z/subprojects/packagecache/ruby-3_1_3.tar.gz \
            https://github.com/ruby/ruby/archive/refs/tags/v3_1_3.tar.gz
          echo "c87fc4789233ad90cb1b865e547a257d3c15b3e8e6918b153197e1ed4e47226b  third_party/mkxp-z/subprojects/packagecache/ruby-3_1_3.tar.gz" | sha256sum -c -

      - name: Build mkxp-z.nro
        run: bash scripts/build-mkxp-z-switch.sh

      - name: Upload mkxp-z.nro
        uses: actions/upload-artifact@v7
        with:
          name: mkxp-z-core
          path: sdcard/switch/nx.rpg/cores/mkxp-z.nro
          retention-days: 1

  package:
    name: Package artifacts (launcher / cores zips)
    runs-on: ubuntu-latest
    needs: [launcher, easyrpg, nxjs-mvz, mkxp-z]
    steps:
      - uses: actions/checkout@v6

      - name: Download launcher NRO
        uses: actions/download-artifact@v8
        with:
          name: nx-rpg-launcher-nro
          path: pkg-launcher/switch/nx.rpg

      - name: Download the three core NROs
        uses: actions/download-artifact@v8
        with:
          pattern: '*-core'
          merge-multiple: true
          path: pkg-cores/switch/nx.rpg/cores

      - name: Add SD layout README to both zips
        run: |
          set -euo pipefail
          mkdir -p pkg-launcher/switch/nx.rpg/cores
          cp sdcard/switch/nx.rpg/config/global.example.json pkg-launcher/switch/nx.rpg/config/global.example.json 2>/dev/null || true
          cp LICENSE THIRD_PARTY_LICENSES.md pkg-launcher/switch/nx.rpg/ 2>/dev/null || true
          for d in games saves rtp fonts config runtime cache; do
            mkdir -p pkg-cores/switch/nx.rpg/$d pkg-launcher/switch/nx.rpg/$d
          done
          {
            echo "nx.rpg launcher package"
            echo "======================="
            echo "Copy the whole 'switch/nx.rpg' folder to the ROOT of your SD card,"
            echo "then download the 'nx-rpg-cores' artifact and copy its three .nro"
            echo "files into sdcard:/switch/nx.rpg/cores/."
            echo ""
            echo "Launch nx.rpg.nro while holding R (Title Takeover) for full RAM."
          } > pkg-launcher/switch/nx.rpg/README.txt
          {
            echo "nx.rpg core package"
            echo "==================="
            echo "Copy the three .nro files into sdcard:/switch/nx.rpg/cores/ on your"
            echo "SD card (merge with the launcher package from the nx-rpg-launcher"
            echo "artifact)."
            echo ""
            echo "  easyrpg.nro   -> RPG Maker 2000 / 2003"
            echo "  nxjs-mvz.nro  -> RPG Maker MV / MZ"
            echo "  mkxp-z.nro    -> RPG Maker XP / VX / VX Ace"
          } > pkg-cores/switch/nx.rpg/cores/README.txt
          echo "launcher package:"; find pkg-launcher -type f
          echo "cores package:"; find pkg-cores -type f

      - name: Zip packages
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            LZIP="nx.rpg-${GITHUB_REF_NAME}-launcher.zip"
            CZIP="nx.rpg-${GITHUB_REF_NAME}-cores.zip"
          else
            LZIP="nx.rpg-launcher.zip"
            CZIP="nx.rpg-cores.zip"
          fi
          cd pkg-launcher && zip -qr "../$LZIP" switch && cd ..
          cd pkg-cores && zip -qr "../$CZIP" switch && cd ..
          sha256sum "$LZIP" "$CZIP"

      - name: Assemble GPL corresponding-source archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/bootstrap-cores.sh
          mkdir -p "gpl-src/nx.rpg-v${VERSION}-gpl-sources"
          DST="gpl-src/nx.rpg-v${VERSION}-gpl-sources"
          cp third_party/upstreams.lock.json "$DST"/
          cp -r cores/easyrpg/patches "$DST/easyrpg-patches"
          cp -r cores/nxjs-mvz/patches  "$DST/nxjs-mvz-patches"
          cp -r cores/mkxp-z/patches    "$DST/mkxp-z-patches"
          cp -r cores/mkxp-z/ruby-switch "$DST/mkxp-z-ruby-switch" 2>/dev/null || true
          # Full upstream source snapshots (GPL-3.0 EasyRPG, GPL-2.0 mkxp-z+Ruby; MIT nx.js included for completeness)
          mkdir -p "$DST/EasyRPG-Player" "$DST/nx.js" "$DST/mkxp-z"
          tar -C third_party/EasyRPG-Player --exclude=.git -cf - . | tar -C "$DST/EasyRPG-Player" -xf -
          tar -C third_party/nx.js --exclude=.git --exclude=node_modules -cf - . | tar -C "$DST/nx.js" -xf -
          tar -C third_party/mkxp-z --exclude=.git -cf - . | tar -C "$DST/mkxp-z" -xf -
          cd gpl-src && tar --zstd -cf "../nx.rpg-v${VERSION}-gpl-sources.tar.zst" . && cd ..
          du -h nx.rpg-v"${VERSION}"-gpl-sources.tar.zst

      - name: Upload launcher zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: nx-rpg-launcher
          path: nx.rpg*launcher.zip

      - name: Upload cores zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: nx-rpg-cores
          path: nx.rpg*cores.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nx.rpg-v*-launcher.zip
            nx.rpg-v*-cores.zip
            nx.rpg-v*-gpl-sources.tar.zst
          generate_release_notes: true
