# Meson >= 1.4.0 cross-compilation file for Nintendo Switch (devkitA64 / libnx)
# Upstream baseline: mkxp-z v2.4.2-dev @ a8f9d9ee331034b7778d0f6c3a5603de8b87388f
#
# Recommended Meson invocation (Phase 3):
#   meson setup build/mkxp-z third_party/mkxp-z \
#     --cross-file cores/mkxp-z/cross/switch-aarch64.ini \
#     -Ddefault_system=enabled \
#     -Dgfx_backend=gles \
#     -Daarch64_neon=enabled \
#     -Duse_miniffi=false \
#     -Dworkdir_current=true \
#     -Dcjk_fallback_font=true \
#     -Dopenssl=disabled \
#     -Dangle=disabled \
#     -Dalsa=disabled -Dpulseaudio=disabled -Dpipewire=disabled -Djack=disabled -Doss=disabled

[constants]
devkitpro = '/opt/devkitpro'
toolchain = devkitpro / 'devkitA64/bin'
portlibs  = devkitpro / 'portlibs/switch'
libnx     = devkitpro / 'libnx'

[binaries]
c         = toolchain / 'aarch64-none-elf-gcc'
cpp       = toolchain / 'aarch64-none-elf-g++'
ar        = toolchain / 'aarch64-none-elf-gcc-ar'
strip     = toolchain / 'aarch64-none-elf-strip'
ranlib    = toolchain / 'aarch64-none-elf-gcc-ranlib'
pkgconfig = portlibs / 'bin/aarch64-none-elf-pkg-config'
cmake     = 'cmake'

[built-in options]
default_library = 'static'
c_args = [
  '-march=armv8-a+crc+crypto',
  '-mtune=cortex-a57',
  '-mtp=soft',
  '-fPIE',
  '-D__SWITCH__',
  '-DHAVE_NANOSLEEP',
  '-I' + libnx + '/include',
  '-I' + portlibs + '/include'
]
cpp_args = [
  '-march=armv8-a+crc+crypto',
  '-mtune=cortex-a57',
  '-mtp=soft',
  '-fPIE',
  '-D__SWITCH__',
  '-DHAVE_NANOSLEEP',
  '-I' + libnx + '/include',
  '-I' + portlibs + '/include'
]
c_link_args = [
  '-specs=' + libnx + '/switch.specs',
  '-march=armv8-a+crc+crypto',
  '-mtune=cortex-a57',
  '-mtp=soft',
  '-fPIE',
  '-L' + libnx + '/lib',
  '-L' + portlibs + '/lib',
  '-lnx'
]
cpp_link_args = [
  '-specs=' + libnx + '/switch.specs',
  '-march=armv8-a+crc+crypto',
  '-mtune=cortex-a57',
  '-mtp=soft',
  '-fPIE',
  '-L' + libnx + '/lib',
  '-L' + portlibs + '/lib',
  '-lnx'
]

[properties]
needs_exe_wrapper = true
pkg_config_libdir = [portlibs / 'lib/pkgconfig']

[host_machine]
system     = 'horizon'
cpu_family = 'aarch64'
cpu        = 'cortex-a57'
endian     = 'little'
