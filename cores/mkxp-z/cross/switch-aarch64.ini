# Meson cross-compilation file skeleton for Nintendo Switch (devkitA64 / libnx)
# Phase 3 target: mkxp-z -> cores/mkxp-z.nro
#
# NOTE: Replace /opt/devkitpro with your local $DEVKITPRO path (or generate dynamically via build script).

[constants]
devkitpro = '/opt/devkitpro'
toolchain = devkitpro / 'devkitA64/bin'
portlibs  = devkitpro / 'portlibs/switch'
libnx     = devkitpro / 'libnx'

[binaries]
c          = toolchain / 'aarch64-none-elf-gcc'
cpp        = toolchain / 'aarch64-none-elf-g++'
ar         = toolchain / 'aarch64-none-elf-gcc-ar'
strip      = toolchain / 'aarch64-none-elf-strip'
pkgconfig  = portlibs / 'bin/aarch64-none-elf-pkg-config'
cmake      = 'cmake'

[built-in options]
c_args = [
  '-march=armv8-a+crc+crypto',
  '-mtune=cortex-a57',
  '-mtp=soft',
  '-fPIE',
  '-D__SWITCH__',
  '-I' + libnx + '/include',
  '-I' + portlibs + '/include'
]
cpp_args = [
  '-march=armv8-a+crc+crypto',
  '-mtune=cortex-a57',
  '-mtp=soft',
  '-fPIE',
  '-D__SWITCH__',
  '-I' + libnx + '/include',
  '-I' + portlibs + '/include'
]
c_link_args = [
  '-specs=' + libnx + '/switch.specs',
  '-march=armv8-a+crc+crypto',
  '-mtune=cortex-a57',
  '-mtp=soft',
  '-fPIE',
  '-L' + libnx + '/lib',
  '-L' + portlibs + '/lib'
]
cpp_link_args = [
  '-specs=' + libnx + '/switch.specs',
  '-march=armv8-a+crc+crypto',
  '-mtune=cortex-a57',
  '-mtp=soft',
  '-fPIE',
  '-L' + libnx + '/lib',
  '-L' + portlibs + '/lib'
]

[properties]
needs_exe_wrapper = true
pkg_config_libdir = [portlibs / 'lib/pkgconfig']

[host_machine]
system     = 'horizon'
cpu_family = 'aarch64'
cpu        = 'cortex-a57'
endian     = 'little'
