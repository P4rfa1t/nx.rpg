# Meson >= 1.4.0 cross-compilation file for Nintendo Switch (devkitA64 / libnx)
# Upstream baseline: mkxp-z v2.4.2-dev @ a8f9d9ee331034b7778d0f6c3a5603de8b87388f
#
# Recommended Meson invocation (Phase 3):
#   meson setup build/mkxp-z third_party/mkxp-z \
#     --cross-file cores/mkxp-z/cross/switch-aarch64.ini \
#     -Ddefault_system=enabled \
#     -Dgfx_backend=gles \
#     -Daarch64_neon=enabled \
#     -Duse_miniffi=false \
#     -Dworkdir_current=true \
#     -Dcjk_fallback_font=true \
#     -Dopenssl=disabled \
#     -Dangle=disabled \
#     -Dalsa=disabled -Dpulseaudio=disabled -Dpipewire=disabled -Djack=disabled -Doss=disabled

[constants]
devkitpro = '/opt/devkitpro'
toolchain = '/opt/devkitpro/devkitA64/bin'
portlibs  = '/opt/devkitpro/portlibs/switch'
libnx     = '/opt/devkitpro/libnx'

[binaries]
c         = '/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc'
cpp       = '/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++'
ar        = '/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc-ar'
strip     = '/opt/devkitpro/devkitA64/bin/aarch64-none-elf-strip'
ranlib    = '/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc-ranlib'
pkgconfig = '/opt/devkitpro/portlibs/switch/bin/aarch64-none-elf-pkg-config'
cmake     = 'cmake'

[built-in options]
default_library = 'static'
c_args = ['-march=armv8-a+crc+crypto', '-mtune=cortex-a57', '-mtp=soft', '-fPIE', '-D__SWITCH__', '-DHAVE_NANOSLEEP', '-I/opt/devkitpro/libnx/include', '-I/opt/devkitpro/portlibs/switch/include']
cpp_args = ['-march=armv8-a+crc+crypto', '-mtune=cortex-a57', '-mtp=soft', '-fPIE', '-D__SWITCH__', '-DHAVE_NANOSLEEP', '-I/opt/devkitpro/libnx/include', '-I/opt/devkitpro/portlibs/switch/include']
c_link_args = ['-specs=/opt/devkitpro/libnx/switch.specs', '-march=armv8-a+crc+crypto', '-mtune=cortex-a57', '-mtp=soft', '-fPIE', '-L/opt/devkitpro/libnx/lib', '-L/opt/devkitpro/portlibs/switch/lib', '-lnx']
cpp_link_args = ['-specs=/opt/devkitpro/libnx/switch.specs', '-march=armv8-a+crc+crypto', '-mtune=cortex-a57', '-mtp=soft', '-fPIE', '-L/opt/devkitpro/libnx/lib', '-L/opt/devkitpro/portlibs/switch/lib', '-lnx']

[properties]
needs_exe_wrapper = true
pkg_config_libdir = ['/opt/devkitpro/portlibs/switch/lib/pkgconfig']

[host_machine]
system     = 'horizon'
cpu_family = 'aarch64'
cpu        = 'cortex-a57'
endian     = 'little'
